apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claro-ai-crm
  namespace: claro-ai-crm
spec:
  ingressClassName: traefik
  rules:
    - host: claro-ai-crm.claro-ai-crm.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
